[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "gym-tracker-analysis"
version     = "0.1.0"
description = "Analysis of strength-training logs, body-composition scans and training breaks"
requires-python = ">=3.11"

dependencies = [
  "polars",
  "plotly",
  "jupyterlab",
  "ipykernel",
  "openpyxl",
  "pyarrow",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
